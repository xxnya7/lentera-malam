# Memanggil pengingat malam setiap hari sekitar pukul 21.00 WIB (14.00 UTC).
# Menggantikan Vercel Cron Jobs (legacy) yang tidak pernah memanggil fungsi ini.
# Butuh secret repositori CRON_SECRET yang sama dengan env CRON_SECRET di Vercel.
# Jadwal GitHub bisa terlambat beberapa menit; tombol "Run workflow" untuk tes manual.
name: Pengingat malam
on:
  schedule:
    - cron: '3 14 * * *'
  workflow_dispatch:
jobs:
  kirim:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Panggil /api/pengingat
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -sS -o hasil.json -w '%{http_code}' --max-time 60 -H "Authorization: Bearer $CRON_SECRET" https://lenteraanya.vercel.app/api/pengingat)
          echo "HTTP $code"; cat hasil.json; echo
          test "$code" = 200
